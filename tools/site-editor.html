<title>Eco Era Site Editor</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Nunito:wght@300;400;500;600;700;800&display=swap">
<style>
/* Layout: matches the Posada Natura site editor. A slim tool bar on top, the real page below it, a drawer of waiting changes on the right. Single light theme, to match the site. */
:root{
  --bar:#1f2a22;        /* deep forest, the tool chrome */
  --bar-ink:#eef0e8;
  --paper:#f5f1e8;
  --ink:#1f2a22;
  --muted:#5f685f;
  --gold:#b98a3a;       /* "you are editing this" */
  --green:#2f7d52;      /* "changed, waiting to go live" */
  --line:#ddd6c8;
  --white:#ffffff;
  --stage:#d8d4c9;
  --display:"EB Garamond",Georgia,serif;
  --body:Nunito,system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font:15px/1.5 var(--body);display:flex;flex-direction:column}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.bar{background:var(--bar);color:var(--bar-ink);display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar)}
.brand{font:500 22px/1 var(--display);letter-spacing:.01em;margin-right:auto;white-space:nowrap}
.seg{display:flex;background:rgba(255,255,255,.08);border-radius:999px;padding:3px}
.seg button{border:0;background:none;color:var(--bar-ink);padding:7px 16px;border-radius:999px;font-weight:600;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--bar-ink);color:var(--bar)}
.bar label{font-size:13px;opacity:.8}
.bar select{background:rgba(255,255,255,.1);color:var(--bar-ink);border:1px solid rgba(255,255,255,.25);border-radius:8px;padding:7px 10px;max-width:220px}
.bar select option{color:#000;background:#fff}
.changes-btn{border:0;border-radius:999px;padding:8px 16px;background:var(--gold);color:var(--white);font-weight:700;font-size:14px;display:flex;gap:8px;align-items:center}
.changes-btn .n{background:var(--white);color:var(--gold);border-radius:999px;min-width:22px;padding:0 6px;font-variant-numeric:tabular-nums;text-align:center}
.changes-btn.none{background:rgba(255,255,255,.12)}
.changes-btn.none .n{background:rgba(255,255,255,.25);color:var(--bar-ink)}

.hint{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;padding-block:9px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--white);border-bottom:1px solid var(--line);font-size:14px;color:var(--muted)}
.hint strong{color:var(--ink)}
.key{display:inline-flex;align-items:center;gap:6px}
.sw{width:14px;height:14px;border-radius:3px;display:inline-block;outline:2px solid var(--green)}
.notice{padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:#fbefd6;color:#5b4210;font-size:14px}

.main{flex:1;display:flex;min-height:0}
.stage{flex:1;min-width:0;overflow:auto;background:var(--stage);padding:18px}
.frame{max-width:1360px;margin:0 auto;background:var(--white);box-shadow:0 4px 30px rgba(0,0,0,.15);border-radius:6px;overflow:hidden;position:relative;min-height:200px}
.loading{padding:60px 20px;text-align:center;color:var(--muted);font-size:15px}

.drawer{width:380px;max-width:100%;background:var(--white);border-left:1px solid var(--line);display:none;flex-direction:column;min-height:0}
.drawer.on{display:flex}
.drawer header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)}
.drawer h2{font:600 24px/1.1 var(--display);margin:0}
.x{border:0;background:none;font-size:22px;line-height:1;padding:4px 8px;color:var(--muted)}
.drawer .list{overflow:auto;padding:12px 16px;display:flex;flex-direction:column;gap:12px;flex:1}
.go{padding:14px 16px;border-top:1px solid var(--line);background:#f1f5ee;font-size:14px;display:flex;flex-direction:column;gap:8px}
.go p{margin:0}
.go .say{font-weight:700}
.btn{border:1px solid var(--line);background:var(--white);border-radius:8px;padding:7px 12px;font-size:14px;font-weight:600}
.btn.primary{background:var(--green);border-color:var(--green);color:var(--white)}
.btn.small{padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.item{border:1px solid var(--line);border-left:4px solid var(--green);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.item .meta{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:700}
.item .before{color:var(--muted);text-decoration:line-through;font-size:14px;overflow-wrap:anywhere}
.item .after{font-size:14px;overflow-wrap:anywhere}
.item .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.item img{width:84px;height:60px;object-fit:cover;border-radius:4px;background:#eee}
.item .arrow{color:var(--muted)}
.empty{color:var(--muted);font-size:14px;padding:8px 0}
.live-note{font-size:13px;color:var(--muted)}

.modal{position:fixed;inset:0;background:rgba(20,24,18,.55);display:none;align-items:flex-start;justify-content:center;padding:24px 16px;z-index:50;overflow:auto}
.modal.on{display:flex}
.sheet{background:var(--white);border-radius:10px;width:min(1100px,100%);display:flex;flex-direction:column;max-height:100%}
.sheet header{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;gap:16px;align-items:center}
.sheet header img{width:110px;height:76px;object-fit:cover;border-radius:6px;background:#eee;flex:none}
.sheet h3{font:600 26px/1.1 var(--display);margin:0}
.sheet .sub{color:var(--muted);font-size:14px}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 20px;border-bottom:1px solid var(--line)}
.tools input[type=search]{flex:1;min-width:180px;border:1px solid var(--line);border-radius:8px;padding:8px 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;padding:16px 20px;overflow:auto}
.pick{border:2px solid transparent;border-radius:8px;padding:0;background:none;text-align:left;display:flex;flex-direction:column;gap:4px}
.pick img{width:100%;max-width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:6px;background:#eee}
.pick span{font-size:12px;color:var(--muted);padding:0 2px 4px;line-height:1.3}
.pick[aria-pressed="true"]{border-color:var(--gold)}
.pick:hover img{filter:brightness(1.06)}
.sheet footer{padding:14px 20px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.sheet footer .alt{flex:1;min-width:240px;display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.sheet footer textarea{border:1px solid var(--line);border-radius:8px;padding:8px 10px;resize:vertical;min-height:44px;color:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--bar);color:var(--bar-ink);padding:10px 18px;border-radius:999px;font-size:14px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
@media (max-width:760px){
  .brand{width:100%}
  .drawer{position:fixed;inset:0;width:auto;z-index:40}
  .stage{padding:8px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="bar">
  <div class="brand">Eco Era site editor</div>
  <div class="seg" role="group" aria-label="What to edit">
    <button id="mode-text" aria-pressed="true">Edit text</button>
    <button id="mode-photo" aria-pressed="false">Change photos</button>
  </div>
  <label for="page">Page</label>
  <select id="page"></select>
  <button class="changes-btn none" id="open-drawer"><span>Waiting to go live</span><span class="n" id="count">0</span></button>
</div>
<div class="hint" id="hint"></div>
<div class="notice" id="notice" hidden></div>
<div class="main">
  <div class="stage" id="stage"><div class="frame" id="frame"><div class="loading">Loading the Eco Era site…</div></div></div>
  <aside class="drawer" id="drawer" aria-label="Changes waiting to go live">
    <header><h2>Waiting to go live</h2><button class="x" id="close-drawer" aria-label="Close">×</button></header>
    <div class="list" id="list"></div>
    <div class="go">
      <p>Your changes are saved here. They go live once Claude applies them.</p>
      <p class="say">When you are ready, tell Claude in chat: “Apply my edits from the Eco Era site editor.”</p>
      <div><button class="btn primary" id="copy-say">Copy that message</button></div>
    </div>
  </aside>
</div>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="m-title">
  <div class="sheet">
    <header>
      <img id="m-current" alt="">
      <div style="flex:1;min-width:0">
        <h3 id="m-title">Choose a new photo</h3>
        <div class="sub" id="m-where"></div>
      </div>
      <button class="x" id="m-close" aria-label="Close">×</button>
    </header>
    <div class="tools">
      <input type="search" id="m-search" placeholder="Search photos, for example jaguar, river, yoga">
      <input type="file" id="m-file" accept="image/*" hidden>
      <button class="btn" id="m-upload" hidden>Upload a new photo</button>
      <span class="sub" id="m-upmsg"></span>
    </div>
    <div class="grid" id="m-grid"></div>
    <footer>
      <label class="alt" for="m-alt">Short description of the photo (helps Google and people using screen readers)
        <textarea id="m-alt" rows="2"></textarea>
      </label>
      <button class="btn" id="m-cancel">Cancel</button>
      <button class="btn" id="m-restore" hidden>Keep the original photo</button>
      <button class="btn primary" id="m-save" disabled>Use this photo</button>
    </footer>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
const $ = s => document.querySelector(s);
let PAGES = [], STYLES = '', LIB = [], byId = {};
let mode = 'text', page = 'home';
let db = null, assets = null, readOnly = false;
let edits = new Map(), picks = new Map();
let root = null;
let wantPage = 'home';
try { const h = location.hash.slice(1); if (h) wantPage = h; } catch (e) {}

/* ---------- helpers ---------- */
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clean = s => String(s || '').replace(/\s+/g, ' ').trim();
function hash(s){ let h = 5381; for (let i = 0; i < s.length; i++) h = (h * 33 ^ s.charCodeAt(i)) >>> 0; return h.toString(36); }
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('on'), 2200); }
function notice(msg){ const n = $('#notice'); n.textContent = msg || ''; n.hidden = !msg; }
const photoSrc = p => p.assetId ? '/_blob/' + p.assetId : 'site/' + p.newFile;
const isLocal = s => s && !/^(data:|blob:|https?:|\/|#)/.test(s);
const textOf = h => { const d = document.createElement('div'); d.innerHTML = h; return d.textContent; };

/* ---------- page select + modes ---------- */
$('#page').onchange = e => { page = e.target.value; try { history.replaceState(null, '', '#' + page); } catch (er) {} render(); $('#stage').scrollTop = 0; };
$('#mode-text').onclick = () => setMode('text');
$('#mode-photo').onclick = () => setMode('photo');
function setMode(m){
  mode = m;
  $('#mode-text').setAttribute('aria-pressed', m === 'text');
  $('#mode-photo').setAttribute('aria-pressed', m === 'photo');
  if (root) root.host.className = 'ee-host ee-' + m;
  hint();
}
function hint(){
  const keys = `<span class="key"><span class="sw"></span>changed, waiting to go live</span>`;
  $('#hint').innerHTML = mode === 'text'
    ? `<span><strong>Click any text to change it.</strong> Press Enter or click away to save. Esc undoes.</span>${keys}`
    : `<span><strong>Click any photo to swap it</strong> for another one or for a new photo you upload.</span>${keys}`;
}

/* ---------- render the page snapshot ---------- */
const EDITABLE = 'h1,h2,h3,h4,h5,h6,p,li,blockquote,figcaption,dt,dd,td,th,label,a,button,span,strong,em,small,div,summary,cite,b,i';
function render(){
  const p = byId[page]; if (!p) return;
  const frame = $('#frame');
  frame.innerHTML = '';
  const host = document.createElement('div');
  host.className = 'ee-host ee-' + mode;
  frame.appendChild(host);
  root = host.attachShadow({mode: 'open'});
  const html = p.html.replace(/url\((['"]?)(?!data:|https?:|blob:|\/|#)/g, 'url($1site/');
  root.innerHTML = `<style>${STYLES}
    :host{display:block}
    .ee-root{position:relative}
    .ee-root *{animation:none!important;animation-timeline:auto!important}
    .ee-root nav[data-dc-tpl="96"]{position:absolute!important}
    .ee-root [data-rail]{display:none!important}
    :host(.ee-text) [data-e]{cursor:text}
    :host(.ee-text) [data-e]:hover{outline:2px dashed #b98a3a;outline-offset:2px}
    [data-e][contenteditable="true"]{outline:2px solid #b98a3a!important;outline-offset:2px;background:rgba(255,236,190,.6)!important;color:#1f2a22!important;-webkit-text-fill-color:#1f2a22!important;text-shadow:none!important}
    .ee-changed{outline:2px solid #2f7d52!important;outline-offset:2px}
    :host(.ee-photo) .ee-root *{pointer-events:none!important}
    :host(.ee-photo) img[data-p]{cursor:pointer;pointer-events:auto!important}
    :host(.ee-photo) img[data-p]:hover{outline:4px solid #b98a3a;outline-offset:-4px;filter:brightness(1.08)}
    img.ee-changed{outline:4px solid #2f7d52!important;outline-offset:-4px}
  </style><div class="ee-root">${html}</div>`;
  root.querySelectorAll('details').forEach(d => d.open = true);
  // word-by-word reveal headings were captured mid-fade: show every word fully
  root.querySelectorAll('span[style*="opacity"]').forEach(s => { s.style.opacity = '1'; s.style.filter = 'none'; });
  root.querySelectorAll('video').forEach(v => { v.removeAttribute('autoplay'); v.preload = 'none'; });

  // photos: every local image gets an id, and points at the bundled copy
  const seenP = {};
  for (const img of root.querySelectorAll('img')) {
    const src = img.getAttribute('src');
    if (!isLocal(src)) continue;
    const file = src.replace(/^\.\//, '');
    const k = page + '~' + file.replace(/[^A-Za-z0-9_.-]/g, '_');
    seenP[k] = (seenP[k] || 0) + 1;
    img.dataset.p = k + '~' + seenP[k];
    img._file = file; img._alt = img.getAttribute('alt') || '';
    img.removeAttribute('srcset');
    img.setAttribute('src', 'site/' + file);
  }
  // text: the outermost element that holds text directly
  const seen = {};
  for (const el of root.querySelectorAll(EDITABLE)) {
    if (el.parentElement && el.parentElement.closest('[data-e]')) continue;
    if (el.closest('svg,select,style,[aria-hidden="true"]')) continue;
    const own = [...el.childNodes].some(n => n.nodeType === 3 && /[A-Za-z0-9À-ɏ]{2}/.test(n.textContent));
    if (!own) continue;
    el._orig = el.innerHTML;
    const k = page + '~' + hash(el._orig);
    seen[k] = (seen[k] || 0) + 1;
    el.dataset.e = k + '~' + seen[k];
  }
  paint(); hint();
}

function paint(){
  if (!root) return;
  for (const el of root.querySelectorAll('[data-e]')) {
    if (el.isContentEditable) continue;
    const e = edits.get(el.dataset.e); const pend = e && e.status === 'pending' ? e : null;
    const want = pend ? pend.afterHtml : el._orig;
    if (el.innerHTML !== want) el.innerHTML = want;
    el.classList.toggle('ee-changed', !!pend);
  }
  for (const img of root.querySelectorAll('img[data-p]')) {
    const pk = picks.get(img.dataset.p); const pend = pk && pk.status === 'pending' ? pk : null;
    const src = pend ? photoSrc(pend) : 'site/' + img._file;
    if (img.getAttribute('src') !== src) img.setAttribute('src', src);
    img.setAttribute('alt', pend ? pend.alt : img._alt);
    img.classList.toggle('ee-changed', !!pend);
  }
}

function nearOf(el){
  const s = el.closest('section');
  const lab = s && (s.getAttribute('data-screen-label') || s.getAttribute('data-chapter'));
  if (lab) return lab;
  const h = s && s.querySelector('h1,h2,h3');
  if (h) return clean(h.textContent).slice(0, 60);
  return el.closest('nav') ? 'Menu' : el.closest('footer') ? 'Footer' : 'Top of page';
}
function labelFor(el){
  const t = el.tagName.toLowerCase();
  if (/^h[1-6]$/.test(t)) return 'Heading';
  if (t === 'a' || t === 'button' || el.closest('a,button')) return 'Button or link';
  if (t === 'li') return 'List item';
  if (t === 'blockquote' || el.closest('blockquote')) return 'Quote';
  return 'Text';
}

/* ---------- text editing ---------- */
let editing = null;
function onStageClick(ev){
  if (!root) return;
  const path = ev.composedPath();
  if (editing && path.includes(editing)) return;
  if (path.find(n => n.tagName === 'A' || n.tagName === 'BUTTON' || n.tagName === 'SUMMARY' || n.tagName === 'LABEL' || n.tagName === 'IMG')) ev.preventDefault();
  if (mode === 'photo') {
    const img = path.find(n => n.tagName === 'IMG' && n.dataset && n.dataset.p);
    if (img) openPicker(img);
    return;
  }
  const el = path.find(n => n.dataset && n.dataset.e != null);
  if (!el || el === editing) return;
  if (readOnly) { toast('Saving is not available here, so text cannot be changed'); return; }
  startEdit(el);
}
function startEdit(el){
  if (editing) finishEdit(editing);
  editing = el;
  el._before = el.innerHTML;
  el.contentEditable = 'true';
  el.focus();
  const sel = root.getSelection ? root.getSelection() : getSelection();
  try { const r = document.createRange(); r.selectNodeContents(el); r.collapse(false); sel.removeAllRanges(); sel.addRange(r); } catch (e) {}
  el.onkeydown = ev => {
    if (ev.key === 'Enter' && !ev.shiftKey) { ev.preventDefault(); el.blur(); }
    else if (ev.key === 'Escape') { el.innerHTML = el._before; el.blur(); }
    else if (ev.key === ' ' && el.closest('button,summary')) { ev.preventDefault(); document.execCommand('insertText', false, ' '); }
  };
  el.onpaste = ev => { ev.preventDefault(); const t = (ev.clipboardData || window.clipboardData).getData('text/plain'); document.execCommand('insertText', false, t.replace(/\s*\n\s*/g, ' ')); };
  el.onblur = () => finishEdit(el);
}
async function finishEdit(el){
  if (editing !== el) return;
  editing = null;
  el.removeAttribute('contenteditable');
  el.onblur = el.onkeydown = el.onpaste = null;
  el.innerHTML = el.innerHTML.replace(/&nbsp;/g, ' ').replace(/<br>\s*$/, '').replace(/<\/?font[^>]*>/g, '');
  const id = el.dataset.e, now = el.innerHTML, prev = edits.get(id);
  if (clean(el.textContent) === clean(textOf(el._orig)) && now.replace(/\s+/g, ' ') === el._orig.replace(/\s+/g, ' ')) {
    if (prev && prev.status === 'pending') await removeEdit(id); else paint();
    return;
  }
  if (prev && prev.status === 'pending' && prev.afterHtml === now) { paint(); return; }
  const row = {
    page, pageName: byId[page].name, near: nearOf(el), label: labelFor(el),
    beforeText: clean(textOf(el._orig)), afterText: clean(el.textContent),
    beforeHtml: el._orig, afterHtml: now, status: 'pending', updatedAt: new Date().toISOString()
  };
  edits.set(id, row); paint(); list();
  try { await db.collection('edits').doc(id).set(row); toast('Saved'); }
  catch (e) { if (prev) edits.set(id, prev); else edits.delete(id); paint(); list(); failed(e); }
}
async function removeEdit(id){
  const prev = edits.get(id);
  edits.delete(id); paint(); list();
  try { await db.collection('edits').doc(id).delete(); toast('Put back the original'); }
  catch (e) { if (prev) edits.set(id, prev); paint(); list(); failed(e); }
}
function failed(e){
  if (e && e.code === 'invalid_argument') { readOnly = true; notice('This view cannot save changes. Open the editor on claude.ai while signed in to the account that owns it.'); }
  else toast('That did not save. Please try again in a moment.');
}

/* ---------- photo picker ---------- */
let slot = null, chosen = null;
function openPicker(img){
  if (readOnly) { toast('Saving is not available here, so photos cannot be changed'); return; }
  const id = img.dataset.p, pk = picks.get(id);
  const pending = pk && pk.status === 'pending' ? pk : null;
  slot = {id, file: img._file, alt: img._alt, near: nearOf(img)}; chosen = null;
  $('#m-current').src = pending ? photoSrc(pending) : 'site/' + slot.file;
  $('#m-where').textContent = `${byId[page].name} page, photo in “${slot.near}”` + (pending ? '. A new photo is waiting to go live here.' : '');
  $('#m-alt').value = pending ? pending.alt : slot.alt;
  $('#m-restore').hidden = !pending;
  $('#m-save').disabled = true;
  $('#m-search').value = '';
  $('#m-upmsg').textContent = '';
  grid();
  $('#modal').classList.add('on');
  $('#m-search').focus();
}
function grid(){
  const q = $('#m-search').value.toLowerCase().trim();
  const items = LIB.filter(x => !q || (x.title + ' ' + x.file).toLowerCase().includes(q));
  $('#m-grid').innerHTML = items.map(x => `<button class="pick" data-file="${esc(x.file)}" aria-pressed="${!!(chosen && chosen.file === x.file)}"><img loading="lazy" src="site/${esc(x.file)}" alt=""><span>${esc(x.title)}${slot && x.file === slot.file ? ' · in this spot now' : ''}</span></button>`).join('')
    || '<p class="empty">No photos match. Try another word, or upload a new photo.</p>';
}
$('#m-search').oninput = grid;
$('#m-grid').onclick = ev => {
  const b = ev.target.closest('.pick'); if (!b) return;
  chosen = {file: b.dataset.file};
  $('#m-current').src = 'site/' + chosen.file;
  $('#m-save').disabled = chosen.file === slot.file;
  grid();
};
$('#m-upload').onclick = () => $('#m-file').click();
$('#m-file').onchange = async ev => {
  const f = ev.target.files[0]; ev.target.value = '';
  if (!f) return;
  $('#m-upmsg').textContent = 'Uploading…';
  try {
    const blob = await shrink(f);
    const r = await assets.upload(blob, {type: blob.type || 'image/jpeg'});
    chosen = {assetId: r.id, uploadName: f.name};
    $('#m-current').src = r.url;
    $('#m-save').disabled = false;
    $('#m-upmsg').textContent = 'Uploaded. Add a short description, then choose “Use this photo”.';
    $('#m-alt').value = ''; $('#m-alt').focus();
  } catch (e) {
    $('#m-upmsg').textContent = e && e.code === 'too_large' ? 'That photo is too large. Please choose one under 20 MB.'
      : e && e.code === 'unsupported_type' ? 'That file type is not supported. Please use a JPG, PNG or WebP photo.'
      : 'The upload did not work. Please try again.';
  }
};
async function shrink(f){
  try {
    if (!/^image\/(jpeg|png|webp)$/.test(f.type)) return f;
    const bmp = await createImageBitmap(f);
    const k = Math.min(1, 2400 / Math.max(bmp.width, bmp.height));
    if (k === 1 && f.size < 8e6) return f;
    const c = document.createElement('canvas'); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    return await new Promise(res => c.toBlob(b => res(b || f), 'image/jpeg', 0.9));
  } catch (e) { return f; }
}
function closePicker(){ $('#modal').classList.remove('on'); slot = null; }
$('#m-close').onclick = $('#m-cancel').onclick = closePicker;
$('#modal').onclick = ev => { if (ev.target.id === 'modal') closePicker(); };
document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && $('#modal').classList.contains('on')) closePicker(); });
$('#m-alt').oninput = () => { const pk = slot && picks.get(slot.id); if (chosen || (pk && pk.status === 'pending')) $('#m-save').disabled = false; };
$('#m-save').onclick = async () => {
  const s = slot, prev = picks.get(s.id);
  const base = chosen || (prev && prev.status === 'pending' ? {file: prev.newFile, assetId: prev.assetId, uploadName: prev.uploadName} : null);
  if (!base) return;
  const alt = clean($('#m-alt').value);
  const row = {
    page, pageName: byId[page].name, near: s.near,
    currentFile: s.file, currentAlt: s.alt,
    newFile: base.file || null, assetId: base.assetId || null, uploadName: base.uploadName || null,
    alt, altChanged: alt !== s.alt, status: 'pending', updatedAt: new Date().toISOString()
  };
  picks.set(s.id, row); closePicker(); paint(); list();
  try { await db.collection('photo_picks').doc(s.id).set(row); toast('Saved'); }
  catch (e) { if (prev) picks.set(s.id, prev); else picks.delete(s.id); paint(); list(); failed(e); }
};
$('#m-restore').onclick = async () => { const id = slot.id; closePicker(); await removePick(id); };
async function removePick(id){
  const prev = picks.get(id);
  picks.delete(id); paint(); list();
  try { await db.collection('photo_picks').doc(id).delete(); toast('Put back the original'); }
  catch (e) { if (prev) picks.set(id, prev); paint(); list(); failed(e); }
}

/* ---------- drawer of waiting changes ---------- */
$('#open-drawer').onclick = () => $('#drawer').classList.toggle('on');
$('#close-drawer').onclick = () => $('#drawer').classList.remove('on');
$('#copy-say').onclick = async () => {
  try { await navigator.clipboard.writeText('Apply my edits from the Eco Era site editor.'); toast('Copied. Paste it in your chat with Claude.'); }
  catch (e) { toast('Copy did not work here. Just type it in the chat.'); }
};
function list(){
  const te = [...edits.entries()].filter(([, e]) => e.status === 'pending');
  const ph = [...picks.entries()].filter(([, p]) => p.status === 'pending');
  const live = [...edits.values(), ...picks.values()].filter(x => x.status === 'applied').length;
  const n = te.length + ph.length;
  $('#count').textContent = n;
  $('#open-drawer').classList.toggle('none', !n);
  const order = id => { const i = PAGES.findIndex(p => p.id === id); return i < 0 ? 99 : i; };
  ph.sort((a, b) => order(a[1].page) - order(b[1].page) || (a[1].updatedAt < b[1].updatedAt ? -1 : 1));
  te.sort((a, b) => order(a[1].page) - order(b[1].page) || (a[1].updatedAt < b[1].updatedAt ? -1 : 1));
  let h = '';
  for (const [id, p] of ph) h += `<div class="item"><div class="meta">${esc(p.pageName)} · photo in “${esc(p.near)}”</div>
    <div class="row"><img src="site/${esc(p.currentFile)}" alt="Current photo"><span class="arrow">→</span><img src="${esc(photoSrc(p))}" alt="New photo"></div>
    <div class="row"><button class="btn small" data-show="${esc(id)}" data-page="${esc(p.page)}" data-kind="photo">Show me</button><button class="btn small" data-undo-pick="${esc(id)}">Keep the original</button></div></div>`;
  for (const [id, e] of te) h += `<div class="item"><div class="meta">${esc(e.pageName)} · ${esc(e.label)} in “${esc(e.near)}”</div>
    <div class="before">${esc(e.beforeText)}</div><div class="after">${esc(e.afterText) || '<em>(left empty)</em>'}</div>
    <div class="row"><button class="btn small" data-show="${esc(id)}" data-page="${esc(e.page)}" data-kind="text">Show me</button><button class="btn small" data-undo-edit="${esc(id)}">Put back the original</button></div></div>`;
  if (!n) h = '<p class="empty">Nothing waiting. Click text or a photo on the page to change it.</p>';
  if (live) h += `<p class="live-note">${live} earlier change${live === 1 ? ' is' : 's are'} already applied.</p>`;
  $('#list').innerHTML = h;
}
$('#list').onclick = ev => {
  const b = ev.target.closest('button'); if (!b) return;
  if (b.dataset.undoEdit) removeEdit(b.dataset.undoEdit);
  if (b.dataset.undoPick) removePick(b.dataset.undoPick);
  if (b.dataset.show && byId[b.dataset.page]) {
    page = b.dataset.page; $('#page').value = page;
    setMode(b.dataset.kind === 'photo' ? 'photo' : 'text'); render();
    const t = root.querySelector(`[data-e="${CSS.escape(b.dataset.show)}"],[data-p="${CSS.escape(b.dataset.show)}"]`);
    if (t) t.scrollIntoView({block: 'center'});
    if (matchMedia('(max-width:760px)').matches) $('#drawer').classList.remove('on');
  }
};

/* ---------- start ---------- */
$('#frame').addEventListener('click', onStageClick);
hint(); list();
fetch('site/library.json').then(r => r.ok ? r.json() : []).then(l => { LIB = l; }).catch(() => {});
fetch('site/pages.json').then(r => { if (!r.ok) throw new Error('pages'); return r.json(); }).then(d => {
  PAGES = d.pages; STYLES = d.styles; byId = Object.fromEntries(PAGES.map(p => [p.id, p]));
  for (const p of PAGES) $('#page').insertAdjacentHTML('beforeend', `<option value="${esc(p.id)}">${esc(p.name)}</option>`);
  page = byId[wantPage] ? wantPage : 'home';
  $('#page').value = page;
  render(); list();
}).catch(() => { $('#frame').innerHTML = '<div class="loading">The site could not be loaded. Please reload the page.</div>'; });
(async () => {
  try { db = window.claude && await claude.use('db'); } catch (e) { db = null; }
  if (!db) { readOnly = true; notice('Saving is not available in this view. Open the editor on claude.ai while signed in to the account that owns it.'); return; }
  try { assets = await claude.use('assets'); } catch (e) { assets = null; }
  $('#m-upload').hidden = !assets;
  const slow = setTimeout(() => notice('Still loading your saved changes. If this stays, check your connection.'), 10000);
  const onErr = () => { clearTimeout(slow); notice('Your saved changes could not be loaded. Please reload the page.'); };
  db.collection('edits').onSnapshot(s => {
    clearTimeout(slow); if (!s.metadata.fromCache) notice('');
    edits = new Map(s.docs.map(d => [d.id, d.data()])); paint(); list();
  }, onErr);
  db.collection('photo_picks').onSnapshot(s => {
    picks = new Map(s.docs.map(d => [d.id, d.data()])); paint(); list();
  }, onErr);
})();
</script>
